<!DOCTYPE html>
<html>
<link rel="stylesheet" href="index.css">
  <body>
    <div id="loadingBackground">
    <div id="load" onclick="load(0)" onload="load(5000)">
  <h1>Welcome on PlantOS</h1>
  <h2>Loading...</h2>
  <h3>click to continue</h3>
  <h4 id="testt"></h4>
  <img src="img\plant.png">
    </div>
    </div>
    <div id="Windows1" class="Windows" style="background-color: greenyellow;" onclick="ZindexUp(Windows1 , WindowsCalc , WindowsNote , WindowsWeb, WindowsSettings)">
      <div id="WindowsHandle" class="Handle DarkMode" onpointerdown="attraper(this, event)">Welcome !<span style="visibility: hidden; width: 1.875rem;"></span><div class="CloseButton" onclick="CloseWindows(Windows1)">X</div></div>
      Here we can see all of my apps!
    </div>
    <div id="NavBar">
    <p style="margin-left: 5%; cursor: pointer;" onclick="OpenWindows(Windows1)">Plant OS</p><p id="TimeElement">Date</p>
    <div style="display: flex; align-items: center; gap: 0.5em; margin-right: 1em;">
    <img src="img\WifiIcon.png" style="height: 1em; width: 1em;"></div>
    </div>
    <div id="apps" style="justify-content: flex-start; align-items: flex-start;">
      <div id=Icons style="display: flex; align-items: center; flex-direction: column;"><img src="img\Notes.png" style="height: 32px; width: 32px; justify-content: flex-start; flex-direction: column; display: flex;" onclick="OpenWindows(WindowsNote)">
      <p>Notes</p>
      <img src="img\Calc.png" style="height: 32px; width: 32px; justify-content: flex-start; flex-direction: column; display: flex;" onclick="OpenWindows(WindowsCalc)">
      <p>Calc</p>
      <img src="img\Web.png" style="height: 32px; width: 32px; justify-content: flex-start; flex-direction: column; display: flex;" onclick="OpenWindows(WindowsWeb)">
      <p>Web</p>
      <img src="img\Settings.png" style="height: 32px; width: 32px; justify-content: flex-start; flex-direction: column; display: flex;" onclick="OpenWindows(WindowsSettings)">
      <p>Settings</p></div>
    <div id="WindowsNote" class="Windows" style="display: none; background-color: goldenrod;" onclick="ZindexUp(WindowsNote , Windows1 , WindowsCalc , WindowsWeb , WindowsSettings)">
 <div id="NoteHandle" class="Handle DarkMode" onpointerdown="attraper(this, event)">
   Notes <span style="visibility: hidden; width: 19.375rem;"></span><div class="CloseButton" onclick="CloseWindows(WindowsNote)">X</div>
 </div>
 <div id="NoteContainer" style="margin-top: 5px;">
  <div id="NoteBar" style="background-color: aliceblue;" class="DarkMode"></div>
  <div id="NoteContain"></div>
 </div>
</div>
    <div id="WindowsCalc" class="Windows" style="display: none; background-color: green;" onclick="ZindexUp(WindowsCalc , Windows1 , WindowsNote , WindowsWeb , WindowsSettings)">
 <div id="CalcHandle" class="Handle DarkMode" onpointerdown="attraper(this, event)">
   Calculator<span style="visibility: hidden; width: 4.375rem;"></span><div class="CloseButton" onclick="CloseWindows(WindowsCalc)">X</div>
 </div>
 <div id="MyCalc"></div>
</div>
      <div id="WindowsWeb" class="Windows" style="display: none; background-color: yellow;" onclick="ZindexUp(WindowsCalc , Windows1 , WindowsNote , WindowsWeb , WindowsSettings)">
 <div id="WebHandle" class="Handle DarkMode" onpointerdown="attraper(this, event)">
   Web<span style="visibility: hidden; width: 4.688rem;"></span><div class="CloseButton" onclick="CloseWindows(WindowsWeb)">X</div>
 </div>
 <div id="MyWeb">
  <div style="display: flex; flex-direction: row;"><input type="text" id="google" class="DarkMode" style="display: flex; align-items: flex-start; border: solid black 2px; padding: 0.5rem ; margin: 0.25rem; margin-top: 0.5rem; border-radius: 10px;"><div style=" display:flex; align-items: flex-end; margin: 0.25rem; margin-top: 0.5rem; border: solid black 2px; cursor: pointer;border-radius: 50%; background-color: aliceblue; padding: 0.5rem" onclick="search()" class="DarkMode">OK</div></div>
 </div>
</div>
      <div id="WindowsSettings" class="Windows" style="display: none; background-color: #ABC257;" onclick="ZindexUp(WindowsSettings , WindowsCalc , Windows1 , WindowsNote , WindowsWeb)">
 <div id="SettingHandle" class="Handle DarkMode" onpointerdown="attraper(this, event)">
   Settings<span style="visibility: hidden; width: 0.313rem;"></span><div class="CloseButton" onclick="CloseWindows(WindowsSettings)">X</div>
 </div>
 <div id="MySettings" style="display: flex;flex-direction: row;">
  <p>Mode Sombre</p>
  <input type="checkbox" id="Sombre" onclick="BlackTheme()">
 </div>
</div>
</div>
    <script src="index.js"></script>
  </body>
</html>
